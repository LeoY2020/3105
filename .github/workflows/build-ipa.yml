name: Build unsigned IPA (Xcode 27)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build 3105 with Xcode 27
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/3105.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/3105.xcarchive/Products/Applications/3105.app"
          test -d "$APP_PATH"
          rm -rf build/Payload build/3105-unsigned.ipa
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/3105.app
          /usr/bin/zip -qry build/3105-unsigned.ipa build/Payload
          test -f build/3105-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa-xcode27
          path: build/3105-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
